<!DOCTYPE html>
<html>
<head>
  <title>My University - PYQ</title>
  <meta name="description" content="Find previous year question papers of Rabindranath Tagore University. Browse BSc, BA and BCom papers by department, semester and year.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial; padding: 20px; background: #f4f6fb; }
    h2 { color: #173b70; }
    select, input {
      width: 100%; padding: 12px; margin: 10px 0;
      border: 1px solid #ccc; border-radius: 8px;
    }
    .card {
      background: white; padding: 16px;
      border-radius: 10px; margin-top: 15px;
    }
  </style>
</head>
<body>
  <h2>Previous Year Question Papers</h2>
  <p>Rabindranath Tagore University</p>

  <select id="stream">
    <option value="">Select Stream</option>
    <option value="BSc">BSc (Science)</option>
    <option value="BA">BA (Arts)</option>
    <option value="BCom">BCom (Commerce)</option>
</select>
  
<select id="department">
  <option value="">Select Department</option>
</select>
  <select id="semester">
    <option value="">Select Semester</option>
    <option>Semester 1</option>
    <option>Semester 2</option>
    <option>Semester 3</option>
    <option>Semester 4</option>
    <option>Semester 5</option>
    <option>Semester 6</option>
<option>Semester 7</option>
<option>Semester 8</option>
  </select>
<select id="year">
    <option value="">Select Year</option>
    <option>2026</option>
    <option>2025</option>
    <option>2024</option>
    <option>2023</option>
  </select>

<input type="text" id="search" placeholder="Search subject...">
  <div id="paperList"></div>
  <script>
const stream = document.getElementById("stream");
const department = document.getElementById("department");
const semester = document.getElementById("semester");
const year = document.getElementById("year");
const search = document.getElementById("search");
    
const departments = {
  BSc: ["Mathematics", "Physics", "Chemistry", "Botany", "Zoology"],
  BA: ["History", "Political Science", "English", "Economics"],
  BCom: ["Accountancy", "Management", "Finance", "Business Studies"]
};

stream.addEventListener("change", function() {
  department.innerHTML = '<option value="">Select Department</option>';

  const list = departments[stream.value] || [];

  list.forEach(name => {
    department.innerHTML += `<option value="${name}">${name}</option>`;
  });

  showPapers();
});
const papers = [
  {
    stream: "BSc",
    department: "Mathematics",
    semester: "Semester 3",
    year: "2024",
    subject: "Major 3.1",
    file: "3.1(24).pdf"
  }
];

function showPapers() {
  const result = papers.filter(p =>
    (!stream.value || p.stream === stream.value) &&
    (!department.value || p.department === department.value) &&
    (!semester.value || p.semester === semester.value) &&
    (!year.value || p.year === year.value) &&
    (!search.value || p.subject.toLowerCase().includes(search.value.toLowerCase()))
  );

  const card = document.getElementById("paperList");
  card.innerHTML = "";

  result.forEach(p => {
    card.innerHTML += `
      <div class="card">
        <h3>${p.department} – ${p.subject}</h3>
        <p>${p.semester} | ${p.year}</p>
        <a href="${p.file}" target="_blank">View PDF</a>
        <a href="${p.file}" download>Download PDF</a>
      </div>`;
  });

  if (!result.length) {
    card.innerHTML = "<p>No papers found.</p>";
  }
}

[stream, department, semester, year, search].forEach(el => {
  el.addEventListener("change", showPapers);
  el.addEventListener("input", showPapers);
});

showPapers();
</script>
</body>
</html>
