<!DOCTYPE html>
<html>
<head>
  <title>My University - PYQ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial; padding: 20px; background: #f4f6fb; }
    h2 { color: #173b70; }
    select, input {
      width: 100%; padding: 12px; margin: 10px 0;
      border: 1px solid #ccc; border-radius: 8px;
    }
    .card {
      background: white; padding: 16px;
      border-radius: 10px; margin-top: 15px;
    }
  </style>
</head>
<body>
  <h2>Previous Year Question Papers</h2>
  <p>Rabindranath Tagore University</p>

  <select>
    <option>Select Stream</option>
    <option>Science</option>
    <option>Arts</option>
    <option>Commerce</option>
  </select>

  <select>
    <option>Select Semester</option>
    <option>Semester 1</option>
    <option>Semester 2</option>
    <option>Semester 3</option>
    <option>Semester 4</option>
    <option>Semester 5</option>
    <option>Semester 6</option>
  </select>

  <select>
    <option>Select Year</option>
    <option>2026</option>
    <option>2025</option>
    <option>2024</option>
    <option>2023</option>
  </select>

  <input type="text" placeholder="Search subject...">

  <div class="card">
    <h3>Question Papers</h3>
    <p>Question papers will be added soon.</p>
  </div>
</body>
</html>
